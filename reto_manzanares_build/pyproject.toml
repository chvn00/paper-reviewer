[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manzanares-growth-agent"
version = "2.0.0"
description = "Nucleo comercial auditable para el contact center de Carnes Manzanares"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
manzanares-agent = "app:main"

[tool.setuptools]
py-modules = ["app"]

[tool.setuptools.packages.find]
include = ["manzanares_agent*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
